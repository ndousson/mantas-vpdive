<!-- =========================================================================
     MANTAS 86 — PAGE "MEDIA / VIDÉOS"
     =========================================================================
     ⚠️ IMPORTANT — LA GRILLE DE VIDÉOS EST UN MODULE VP DIVE EN PARTIE DYNAMIQUE.

     => NE PAS remplacer ce module par du HTML statique : on casserait la lecture
        vidéo et l'extraction auto des miniatures.

     MODE D'EMPLOI CÔTÉ VP DIVE :
       1) Garder le MODULE VIDÉO existant tel quel (ne pas y toucher).
       2) Insérer UNIQUEMENT le HERO + l'INTRO ci-dessous AU-DESSUS de ce module.
     (Une maquette de STYLE de la grille — pour un éventuel restyling ultérieur du
      module — est disponible dans exemples/demo-videos-style.html.)

     - Style INLINE uniquement (VP Dive ne garde pas les blocs <style>).
     - Banniere hero : image Unsplash placeholder (TODO-IMAGE).
     ========================================================================= -->

<!-- ============================ NAV LOCALE (dev only) — retour index ============================ -->
<!-- Bouton "retour index" affiché UNIQUEMENT en local (localhost/127.0.0.1). NE PAS coller dans VP Dive. -->
<script>
(function(){
  var h=location.hostname;
  if(h==='localhost'||h==='127.0.0.1'){
    var a=document.createElement('a');
    a.href='/index.html';
    a.textContent='\u2190 Index';
    a.style.cssText='position:fixed;top:14px;left:14px;z-index:9999;background:#062D63;color:#fff;font:600 13px/1 Roboto,sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 6px 18px rgba(6,45,99,.35);';
    a.addEventListener('click',function(){try{var seg=location.pathname.split('/').filter(Boolean)[0];if(seg)localStorage.setItem('mantas.folder',seg);}catch(e){}});
    document.body.appendChild(a);
  }
})();
</script>
